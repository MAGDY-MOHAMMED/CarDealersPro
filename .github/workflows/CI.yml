name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        # هنا الـ sha256 صحيح تماماً لأنها حاوية Docker وليست GitHub Action
        image: postgres@sha256:39bf22a27fc16997092305763ca7b8277be9404be66c14b53fa9cb90afb20dc1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: cardealerspro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_USERNAME: postgres
      TEST_DATABASE_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
      TEST_DATABASE_HOSTNAME: localhost
      TEST_DATABASE_PORT: 5432
      TEST_DATABASE_NAME: cardealerspro_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/cardealerspro:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/cardealerspro:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: ${{ secrets.DOCKER_HUB_USERNAME }}/cardealerspro:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  deploy-to-hf:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: magdy2467
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          # 1. استنساخ المستودع باستخدام التوكن كـ Username
          git clone --depth 1 "https://${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/CarDealersPro" hf-space
          
          # 2. نقل وتحديث ملف الـ Dockerfile بالـ Tag الثابت المرتبط بالـ Commit الحالية
          cp Dockerfile.hf hf-space/Dockerfile
          sed -i "s|DOCKER_HUB_USERNAME/cardealerspro:latest|${DOCKER_HUB_USERNAME}/cardealerspro:${{ github.sha }}|g" hf-space/Dockerfile
          
          cd hf-space 
          git config user.name "GitHub CI"
          git config user.email "ci@cardealerspro.com"
          
          # 3. تحديث مسار الـ Remote لعمل Push مستقر وآمن بدون تكرار طلب الصلاحيات
          git remote set-url origin "https://${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/CarDealersPro"
          
          git add Dockerfile
          
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy immutable image ${{ github.sha }} [skip ci]"
            git push origin main
          fi