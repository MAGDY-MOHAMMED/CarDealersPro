name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref — saves CI minutes AND disk.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: cardealerspro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
      TEST_DATABASE_USERNAME: postgres
      TEST_DATABASE_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
      TEST_DATABASE_HOSTNAME: localhost
      TEST_DATABASE_PORT: 5432
      TEST_DATABASE_NAME: cardealerspro_test
      MIN_DISK_SPACE_MB: "0"

    steps:
      # =====================================================================
      # STEP 1 — FREE DISK FIRST (before anything else touches the disk).
      #
      # GitHub's ubuntu-latest runner ships with ~14 GB of pre-installed
      # tooling we never use. This action strips it aggressively:
      #   android:        ~9 GB   (Android SDK, NDK, emulators)
      #   dotnet:         ~1 GB   (.NET SDKs)
      #   haskell:        ~1 GB   (GHC, cabal)
      #   large-packages: ~5 GB   (unused apt packages)
      #   docker-images:  ~10 GB  (pre-pulled base images)
      #   tool-cache:     ~5 GB   (Node/Python versions we don't need; uv
      #                            uses actions/cache, NOT the tool cache)
      #
      # Net result: ~30 GB free before we start — plenty for torch + build.
      # =====================================================================
      - name: Free Disk Space (aggressive)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true          # safe: setup-uv uses actions/cache, not tool-cache
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false       # keep swap — helps during docker build

      - name: Show disk space (before)
        run: df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          uv pip install --python-platform linux \
            .[dev] \
            -r requirements.txt \
            -r requirements-ml.txt

      - name: Run tests
        run: uv run pytest -v

      # =====================================================================
      # STEP 2 — FREE THE TEST VENV BEFORE DOCKER BUILD.
      # The venv is ~3-4 GB after installing torch. Tests are done, so
      # deleting it now gives the Docker build more headroom.
      # =====================================================================
      - name: Remove test venv
        if: always()
        run: rm -rf .venv

      - name: Prune leftover Docker resources
        run: docker system prune -af --volumes || true

      - name: Show disk space (before Docker build)
        run: df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            ENABLE_AI=true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/cardealerspro:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/cardealerspro:${{ github.sha }}
          # mode=min caches ONLY the final image layers (~1× image size)
          # instead of all intermediate stages (~2× image size). Saves
          # roughly half the GHA cache download during build. Trade-off:
          # repeat builds are slightly slower.
          cache-from: type=gha
          cache-to: type=gha,mode=min
          # Attestation + SBOM manifests add overhead and aren't needed here.
          provenance: false
          sbom: false

      # =====================================================================
      # STEP 3 — VULNERABILITY SCANNING via the official Trivy action.
      # (Replaces the old `docker run ...` block that was broken by a
      # stray comment after a backslash.)
      #
      # Policy:
      #   - BLOCK on CRITICAL, unfixed OS/library CVEs.
      #   - Report HIGH separately via SARIF (non-blocking) — base images
      #     routinely carry HIGH CVEs whose patches are pending upstream.
      # =====================================================================
      - name: Trivy — CRITICAL scan (blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKER_HUB_USERNAME }}/cardealerspro:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Trivy — SARIF report (non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKER_HUB_USERNAME }}/cardealerspro:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-to-hf:
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.magdy2467 }}
          DOCKER_HUB_USERNAME: ${{ secrets.CarDealersPro }}
        run: |
          git clone --depth 1 \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}" \
            hf-space
          cp Dockerfile.hf hf-space/Dockerfile
          sed -i "s|DOCKER_HUB_USERNAME/cardealerspro:latest|${DOCKER_HUB_USERNAME}/cardealerspro:${{ github.sha }}|g" \
            hf-space/Dockerfile
          cd hf-space
          git config user.name "GitHub CI"
          git config user.email "ci@cardealerspro.com"
          git add Dockerfile
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy immutable image ${{ github.sha }} [skip ci]"
            git push \
              "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}" \
              HEAD:main
          fi