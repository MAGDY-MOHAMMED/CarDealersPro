name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: cardealerspro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
      TEST_DATABASE_USERNAME: postgres
      TEST_DATABASE_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
      TEST_DATABASE_HOSTNAME: localhost
      TEST_DATABASE_PORT: 5432
      TEST_DATABASE_NAME: cardealerspro_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Run tests
        run: uv run pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6 #hey
        with:
          context: . #hey mag
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/cardealerspro:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/cardealerspro:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Docker Native)
        run: |
          docker run --rm \
            -v $HOME/.docker/config.json:/root/.docker/config.json \
            ghcr.io/aquasecurity/trivy:0.53.0 image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            ${{ secrets.DOCKER_HUB_USERNAME }}/cardealerspro:${{ github.sha }}

  deploy-to-hf:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: magdy2467
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          git clone --depth 1 "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/CarDealersPro" hf-space          
          cp Dockerfile.hf hf-space/Dockerfile
          sed -i "s|DOCKER_HUB_USERNAME/cardealerspro:latest|${DOCKER_HUB_USERNAME}/cardealerspro:${{ github.sha }}|g" hf-space/Dockerfile
          
          cd hf-space 
          git config user.name "GitHub CI"
          git config user.email "ci@cardealerspro.com"
          
          git add Dockerfile
          
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy immutable image ${{ github.sha }} [skip ci]"
            # الدفع المباشر باستخدام التوكن
            git push "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/CarDealersPro" HEAD:main
          fi