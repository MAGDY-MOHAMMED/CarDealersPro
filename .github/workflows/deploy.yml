name: Sync to Hugging Face
on:
  push:
    branches: [main] # الروبوت هيشتغل أول ما ترفع على فرع main

  # يسمح لك بتشغيل الروبوت يدوياً من GitHub
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://magdy2467:$HF_TOKEN@huggingface.co/spaces/magdy2467/CarDealersPro main
