name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Magdy123456
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_USERNAME: postgres
      TEST_DATABASE_PASSWORD: Magdy123456
      TEST_DATABASE_HOSTNAME: localhost
      TEST_DATABASE_PORT: 5432
      TEST_DATABASE_NAME: cardealerspro_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/cardealerspro:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: magdy1441   # أو magdy2467 حسب حسابك
        run: |
          SPACE_URL="https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/CarDealersPro"
          git clone $SPACE_URL hf-space
          cp Dockerfile.hf hf-space/Dockerfile
          cd hf-space
          git config user.name "GitHub CI"
          git config user.email "ci@cardealerspro.com"
          git add Dockerfile
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Update Docker image reference [skip ci]"
            git push origin main
          fi