version: '3.8' # Docker Compose version

services:
  # ============================================================
  # FastAPI: API
  # ============================================================
  api:
    build:
      context: . # current directory
      dockerfile: Dockerfile
      args:
        - ENABLE_AI=${ENABLE_AI:-false}
    container_name: cardealers-api
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-4}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_AI=${ENABLE_AI:-false}
    restart: always
    networks:
      - main-net
    volumes:
      - storage-uploads:/app/storage/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # Nginx: Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: cardealers-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - storage-uploads:/app/storage/uploads:ro
    depends_on:
      - api
    networks:
      - main-net
    restart: always

networks:
  main-net:
    driver: bridge

volumes:
  storage-uploads:
    driver: local
