version: '3.8'

services:
  # ============================================================
  # FastAPI: الـ API
  # ============================================================
  api:
    build: .
    container_name: cardealers-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - main-net

  # ============================================================
  # PostgreSQL: قاعدة البيانات
  # ============================================================
  db:
    image: postgres:15
    container_name: postgres-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - main-net

networks:
  main-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local
