version: '3.8'

services:
  # ============================================================
  # FastAPI: الـ API
  # ============================================================
  api:
    build: .
    container_name: cardealers-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - main-net
    volumes: # volumes here means that the container will have access to the storage-uploads volume
      - storage-uploads:/app/storage/uploads

  # ============================================================
  # PostgreSQL: قاعدة البيانات
  # ============================================================
  db:
    image: postgres:15
    container_name: postgres-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - main-net

networks:
  main-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  storage-uploads: # storage-uploads is a volume that will be used to store uploaded files
    driver: local
