version: '3.8'

services:
  # ============================================================
  # FastAPI: الـ API
  # ============================================================
  api:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        - ENABLE_AI=${ENABLE_AI:-false}
    container_name: cardealers-api
    ports:
      - "${API_PORT:-7860}:7860"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-7860}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-4}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_AI=${ENABLE_AI:-false}
    restart: always
    networks:
      - main-net
    volumes:
      - storage-uploads:/app/storage/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  main-net:
    driver: bridge

volumes:
  storage-uploads: # storage-uploads is a volume that will be used to store uploaded files
    driver: local
