# Nginx Configuration for Car Dealers Pro
# Optimized for FastAPI production deployment

user nginx; # if user hack the server he will not take the root access
worker_processes auto;
pid /run/nginx.pid; 
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll; # for cpu deload based on kernel epoll , so better performance
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream; # default type for files , security for browser so it will not execute any file

    # Logging
    log_format main '$real_client_ip - $remote_user [$time_local] "$request" ' # 
                    '$status $body_bytes_sent "$http_referer" ' # http_referer for analytics and monitor the traffic , for security , $body_bytes_sent for monitoring the bandwidth
                    '"$http_user_agent" "$http_x_forwarded_for" ' # 
                    'rt=$request_time uct="$upstream_connect_time" ' # rt=$request_time is the client side latency , uct="$upstream_connect_time" is the upstream connection time
                    'uht="$upstream_header_time" urt="$upstream_response_time"'; # uht="$upstream_header_time" is the upstream header time , urt="$upstream_response_time" is the upstream response time

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on; # for better network performance
    tcp_nodelay on; # for better network performance
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M; # for file uploads

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6; #level 9 for better compression but more cpu usage
    gzip_types text/plain text/css text/xml text/javascript # 
               application/json application/javascript application/xml+rss  #
               application/rss+xml font/truetype font/opentype  #
               application/vnd.ms-fontobject image/svg+xml; # no gzip for images or videos which are compressed already how ? 
    gzip_disable "msie6"; # Internet Explorer 6 does not support gzip

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s; # binary for memory footprints and binary representation ,for api requests , max requests in the sec is 100 , for ddos and brute force 
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s; # for general requests 
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m; # for connection limit

    # Upstream FastAPI application
    upstream fastapi_app {
        server api:8000;
        keepalive 32;
    }
        # ============================================================
    # 1. تحديد نطاقات الـ Proxies الموثوقة (Cloudflare هنا كمثال)
    # ============================================================
    # اجلب القائمة الكاملة من: https://www.cloudflare.com/ips-v4/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # لو عندك Load Balancer محلي أو Reverse Proxy تاني، أضف نطاقاته هنا
    # set_real_ip_from 10.0.0.0/8;       # شبكة داخلية
    # set_real_ip_from 172.16.0.0/12;

    # ============================================================
    # 2. إخبار Nginx باستخدام الهيدر الصحيح القادم من الوسيط
    # ============================================================
    # Cloudflare بيبعت IP الحقيقي في CF-Connecting-IP
    # لكن X-Forwarded-For هو الأعم (وبيحتوي على سلسلة IPs)
    real_ip_header CF-Connecting-IP;   # أو X-Forwarded-For لو مش Cloudflare

    # لو هتستخدم X-Forwarded-For، الأفضل تستخدم map لاستخراج أول IP (العميل الحقيقي)
    # لأن السلسلة ممكن تكون "client, proxy1, proxy2"
    map $http_x_forwarded_for $real_client_ip { 
        "~(?<ip>[^,]+)" $ip; # cut the first ip till the comma         # يأخذ أول IP فقط
        default $remote_addr;         # لو مفيش، استخدم remote_addr العادي
    }

    # Server configuration
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Client body size limit for file uploads
        client_max_body_size 100M; # for file uploads
        client_body_buffer_size 128k; # for memory optimization

        # Proxy settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 96k;

        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay; # for API rate limiting , if a hacker send 100 req only 20 will be processed one by one with no delay
        limit_conn conn_limit 10; # for connection limit

        # Health check endpoint (no rate limiting)
        location /health {
            include proxy_params.conf;
            proxy_pass http://fastapi_app;
            access_log off; # no log for health check endpoint
        }

        # API endpoints
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay; # for API rate limiting
            limit_conn conn_limit 10; # for connection limit
            
            include proxy_params.conf;
            
            proxy_pass http://fastapi_app;
            
            # Timeouts
            proxy_connect_timeout 90s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }

        # Static files (if any)
        location /static/ {
            alias /app/static/; # static files path
            expires 30d; # for saving bandwidth and quick loading
            add_header Cache-Control "public, immutable";
            access_log off; # for saving I/O on disk
        }

        # Media files (uploads)
        location /media/ {
            alias /app/storage/uploads/; # media files path
            expires 7d; # for saving bandwidth and quick loading
            add_header Cache-Control "public";
            access_log off; # for saving I/O on disk
        }

        # Root endpoint
        location / {
            limit_req zone=general_limit burst=10 nodelay; # for general rate limiting , if a hacker send 100 req only 10 will be processed one by one with no delay
            
            include proxy_params.conf;
            proxy_pass http://fastapi_app;
            
            # Timeouts
            proxy_connect_timeout 90s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }
        
        # Error pages
        error_page 502 503 504 /50x.html; # for error pages , any error will be handled by this
        location = /50x.html { # return json respones instead of HTML, cause the app " client" expects JSON if returns HTML , the app will crash
            return 503 '{"error": "Service temporarily unavailable"}';
            add_header Content-Type application/json;
        }
    }
}
