services:
  test-db:
    image: postgres:16-alpine
    container_name: test-db
    environment:
      POSTGRES_USER: ${TEST_DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${TEST_DATABASE_PASSWORD:-Magdy123456}
      POSTGRES_DB: ${TEST_DATABASE_NAME:-cardealerspro_test}
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: "no"

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-runner
    depends_on:
      test-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://${TEST_DATABASE_USERNAME:-postgres}:${TEST_DATABASE_PASSWORD:-Magdy123456}@test-db:5432/${TEST_DATABASE_NAME:-cardealerspro_test}
      PYTHONPATH: /app
    command: >
      sh -c "pip install pytest-asyncio httpx python-dotenv && pytest -v"
    volumes:
      - .:/app
      - pytest_cache:/app/.pytest_cache
    restart: "no"

volumes:
  pytest_cache: